site_name: Audiobookshelf for Mere Mortals
site_description: Plain-language self-hosted audiobooks and podcasts with your files on your own disks. One server, libraries and scanning, chapters and metadata, streaming, per-listener progress that survives restarts, podcasts from feeds, and the two-part backup.
site_url: https://paulsullivan33-dev.github.io/audiobookshelf-for-mere-mortals/

